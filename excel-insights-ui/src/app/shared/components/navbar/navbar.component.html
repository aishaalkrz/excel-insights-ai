      <div class="mobile-menu-brand">

        <div>
          <strong>بصيرة</strong>
          <small>حوّل بياناتك إلى رؤى واضحة</small>
        </div>
      </div>

      <button class="close-menu" type="button" (click)="closeMenu()">
        <img src="/icons/close.svg" alt="close" />
      </button>
    </div>

    <ul>
      <li>
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()">
          الرئيسية
        </a>
      </li>

      <li>
        <a routerLink="/features" routerLinkActive="active" (click)="closeMenu()">
          المميزات
        </a>
      </li>

      <li>
        <a routerLink="/how-it-works" routerLinkActive="active" (click)="closeMenu()">
          كيف يعمل
        </a>
      </li>

      <li>
        <a routerLink="/pricing" routerLinkActive="active" (click)="closeMenu()">
          الأسعار
        </a>
      </li>
    </ul>

    <div class="mobile-auth">
      <button class="primary-btn">تسجيل الدخول</button>
