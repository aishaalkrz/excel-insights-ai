<svg width="65" height="63" viewBox="0 0 65 63" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .base-line {
      transform-origin: left center;
      transform-box: fill-box;
      animation: loadingLine 2s ease-in-out infinite;
    }

    .bar {
      transform-origin: bottom center;
      transform-box: fill-box;
      animation: barGrow 1.5s ease-in-out infinite alternate;
    }

    .bar-1 {
      animation-delay: 0s;
    }

    .bar-2 {
      animation-delay: .25s;
    }

    .bar-3 {
      animation-delay: .5s;
    }

    @keyframes loadingLine {
      0% {
        transform: scaleX(.25);
        opacity: .75;
      }

      50% {
        transform: scaleX(1);
        opacity: 1;
      }

      100% {
        transform: scaleX(.25);
        opacity: .75;
      }
    }

    @keyframes barGrow {
      0% {
        transform: scaleY(.7);
        opacity: .8;
      }

      100% {
        transform: scaleY(1);
        opacity: 1;
      }
    }
  </style>

